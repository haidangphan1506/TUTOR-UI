<html lang="vi">
<head>
<meta charset="utf-8">

<title>LMS — Kiến trúc hệ thống</title>
<script>
  (function () {
    const saved = localStorage.getItem('theme');
    const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.classList.toggle('dark', dark);
  })();
</script>
<style>
  :root {
    --bg: #FAF9F5; --surface: #FFFFFF; --surface2: #F0EEE6;
    --ink: #141413; --body: #3D3D3A; --muted: #87867F;
    --line: #D1CFC5; --line-soft: #E6E3DA;
    --clay: #D97757; --clay-soft: rgba(217,119,87,0.10);
    --olive: #788C5D; --olive-soft: rgba(120,140,93,0.12);
    --gold: #C9A45C; --gold-soft: rgba(201,164,92,0.12);
    --blue: #5B7E96; --blue-soft: rgba(91,126,150,0.10);
    --purple: #8B6BAE; --purple-soft: rgba(139,107,174,0.12);
    --zone: rgba(20,20,19,0.025); --zone-line: #D1CFC5;
    --serif: ui-serif, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html.dark {
    --bg: #141413; --surface: #1F1F1D; --surface2: #2A2A28;
    --ink: #FAF9F5; --body: #D1CFC5; --muted: #87867F;
    --line: #3D3D3A; --line-soft: #2A2A28;
    --clay: #E48A6E; --clay-soft: rgba(228,138,110,0.14);
    --olive: #9DB07C; --olive-soft: rgba(157,176,124,0.16);
    --gold: #D4B36F; --gold-soft: rgba(212,179,111,0.14);
    --blue: #7FA3BC; --blue-soft: rgba(127,163,188,0.14);
    --purple: #B897D4; --purple-soft: rgba(184,151,212,0.14);
    --zone: rgba(250,249,245,0.03); --zone-line: #3D3D3A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--body); font-family: var(--sans);
    -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden;
  }
  .bar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 20px; border-bottom: 1px solid var(--line-soft); flex: none;
  }
  .bar h1 { font-family: var(--serif); font-weight: 500; font-size: 19px; color: var(--ink); letter-spacing: -0.01em; }
  .bar .sub { font-family: var(--mono); font-size: 10.5px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .spacer { flex: 1; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em;
    padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px;
    background: transparent; color: var(--muted); cursor: pointer; transition: all .15s ease;
  }
  .chip:hover { color: var(--ink); border-color: var(--muted); }
  .chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .chip.role.on { background: var(--olive); border-color: var(--olive); color: var(--bg); }
  .toolbar-rows { display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .row-label { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
  #themeToggle {
    font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
    padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: transparent; color: var(--muted); cursor: pointer;
  }
  #themeToggle:hover { color: var(--ink); border-color: var(--muted); }

  .stage { flex: 1; position: relative; min-height: 0; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .zone rect { fill: var(--zone); stroke: var(--zone-line); stroke-width: 1; stroke-dasharray: 5 5; rx: 16; }
  .zone .ztitle { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; fill: var(--muted); }
  .zone .zsub { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); opacity: 0.75; }

  .node { cursor: pointer; }
  .node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; rx: 10; transition: stroke .15s ease, filter .15s ease; }
  .node:hover rect { stroke: var(--muted); }
  .node.sel rect { stroke: var(--clay) !important; stroke-width: 2; }
  .node .t  { font-family: var(--sans); font-size: 14px; font-weight: 600; fill: var(--ink); pointer-events: none; }
  .node .m  { font-family: var(--mono); font-size: 11px; fill: var(--muted); pointer-events: none; }
  .node .k  { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--clay); pointer-events: none; }
  .node.store rect { fill: var(--surface2); }
  .node.do rect { fill: var(--olive-soft); stroke: var(--olive); }
  .node.ext rect { stroke-dasharray: 6 3; }
  .node.ai rect { fill: var(--purple-soft); stroke: var(--purple); }
  .node.client rect { fill: var(--blue-soft); stroke: var(--blue); }

  .edge { stroke: var(--muted); stroke-width: 1.6; fill: none; marker-end: url(#a-mut); transition: opacity .2s ease, stroke .2s ease; }
  .edge.dash { stroke-dasharray: 5 4; }
  .edge.thick { stroke-width: 2.5; }
  .elbl { font-family: var(--mono); font-size: 10px; fill: var(--muted); transition: opacity .2s ease; }

  .stage.flowing .edge { opacity: 0.13; }
  .stage.flowing .elbl { opacity: 0.13; }
  .stage.flowing .node { opacity: 0.30; }
  .stage.flowing .zone { opacity: 0.45; }
  .stage.flowing .edge.lit { opacity: 1; stroke: var(--clay); marker-end: url(#a-clay); stroke-dasharray: 7 5; animation: march 0.9s linear infinite; }
  .stage.flowing .elbl.lit { opacity: 1; fill: var(--clay); }
  .stage.flowing .node.lit { opacity: 1; }
  .stage.flowing .node.lit rect { stroke: var(--clay); }
  @keyframes march { to { stroke-dashoffset: -12; } }
  @media (prefers-reduced-motion: reduce) { .stage.flowing .edge.lit { animation: none; } }

  .badge { font-family: var(--mono); font-size: 11px; font-weight: 700; }
  .badge circle { fill: var(--clay); }
  .badge text { fill: var(--bg); }
  .stage:not(.flowing) .badge { display: none; }

  .card {
    position: absolute; max-width: 360px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; box-shadow: 0 6px 24px rgba(0,0,0,0.08);
  }
  #detail { right: 16px; bottom: 16px; width: 350px; max-height: calc(100% - 40px); overflow-y: auto; }
  #detail h3 { font-family: var(--serif); font-weight: 500; font-size: 17px; color: var(--ink); margin-bottom: 2px; }
  #detail .meta { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-bottom: 8px; }
  #detail .df-row { display: flex; gap: 6px; margin-bottom: 5px; font-size: 12px; line-height: 1.5; }
  #detail .df-label { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--clay); flex: none; min-width: 54px; }
  #detail .df-value { font-family: var(--sans); color: var(--body); flex: 1; }
  #detail .df-divider { border: none; border-top: 1px solid var(--line-soft); margin: 8px 0; }
  #detail .df-desc { font-size: 12px; line-height: 1.55; color: var(--muted); }
  #detail .df-desc code, #flowcap code { font-family: var(--mono); font-size: 11px; color: var(--clay); }
  #flowcap { left: 16px; bottom: 16px; max-width: 320px; max-height: calc(100% - 40px); overflow-y: auto; display: none; }
  #flowcap.show { display: block; }
  #flowcap .fname { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--clay); margin-bottom: 6px; }
  #flowcap ol { margin-left: 18px; }
  #flowcap li { font-size: 12.5px; line-height: 1.55; margin-bottom: 10px; cursor: help; border-radius: 4px; padding: 2px 4px; margin-left: -4px; transition: background .12s ease; }
  #flowcap li:hover { background: var(--surface2); }
  .step-json { font-family: var(--mono); font-size: 10.5px; line-height: 1.4; background: var(--surface2); border: 1px solid var(--line-soft); border-radius: 6px; padding: 6px 8px; margin: 4px 0; white-space: pre-wrap; overflow-x: auto; color: var(--body); }
  .step-tip {
    position: fixed; z-index: 50; display: none; pointer-events: none; max-width: 360px;
    font-family: var(--mono); font-size: 10.5px; line-height: 1.4; white-space: pre-wrap; overflow-x: auto;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.18); color: var(--body);
  }
  .step-tip.show { display: block; }
  .src { position: absolute; top: 10px; right: 16px; font-family: var(--mono); font-size: 10px; color: var(--muted); opacity: 0.8; }
  @media (max-width: 880px) {
    body { overflow: auto; }
    .stage { min-height: 80vh; }
    #detail { position: static; width: auto; margin: 10px 16px; }
    #flowcap { position: static; margin: 0 16px 16px; }
  }
</style>
</head>

  tutor:   ["tutor-flow","tutor"],
};

const stage = document.getElementById('stage');
const nodes = document.querySelectorAll('.node');
const edges = document.querySelectorAll('.edge');
const elbls = document.querySelectorAll('.elbl');
const chips = document.querySelectorAll('#chips .chip');
const roleChips = document.querySelectorAll('#roleChips .chip');
const fcap = document.getElementById('flowcap');
const stepTip = document.getElementById('stepTip');
const fsteps = document.getElementById('f-steps');
let currentFlow = null;

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

function setFlow(key) {
  chips.forEach(c => c.classList.toggle('on', c.dataset.flow === key));
  edges.forEach(e => e.classList.remove('lit'));
  elbls.forEach(l => l.classList.remove('lit'));
  nodes.forEach(n => n.classList.remove('lit'));
  stepTip.classList.remove('show');
  if (key === 'all') { stage.classList.remove('flowing'); fcap.classList.remove('show'); currentFlow = null; return; }
  const f = FLOWS[key];
  currentFlow = f;
  stage.classList.add('flowing');
  f.edges.forEach(id => document.getElementById(id)?.classList.add('lit'));
  elbls.forEach(l => { if (f.edges.includes(l.dataset.e)) l.classList.add('lit'); });
  f.nodes.forEach(k => document.querySelector(`.node[data-k="${k}"]`)?.classList.add('lit'));
  document.getElementById('f-name').textContent = f.name;
  fsteps.innerHTML = f.steps.map((s, i) => `
    <li data-idx="${i}">
      <div class="step-t">${esc(s.t)}</div>
    </li>`).join('');
  fcap.classList.add('show');
}
chips.forEach(c => c.addEventListener('click', () => setFlow(c.dataset.flow)));

function tipContent(s) {
  let out = '';
  if (s.req) out += `// request\n${JSON.stringify(s.req, null, 2)}`;
  if (s.res) out += `${out ? '\n\n' : ''}// response\n${JSON.stringify(s.res, null, 2)}`;
  return out || '(không có payload)';
}

function positionTip(evt) {
  const pad = 14, margin = 8;
  const rect = stepTip.getBoundingClientRect();
  let left = evt.clientX + pad;
  let top = evt.clientY + pad;
  if (left + rect.width + margin > window.innerWidth) left = evt.clientX - rect.width - pad;
  if (top + rect.height + margin > window.innerHeight) top = evt.clientY - rect.height - pad;
  stepTip.style.left = Math.max(margin, left) + 'px';
  stepTip.style.top = Math.max(margin, top) + 'px';
}

fsteps.addEventListener('mouseenter', evt => {
  const li = evt.target.closest('li[data-idx]');
  if (!li || !currentFlow) return;
  const s = currentFlow.steps[Number(li.dataset.idx)];
  if (!s) return;
  stepTip.textContent = tipContent(s);
  stepTip.classList.add('show');
  positionTip(evt);
}, true);
fsteps.addEventListener('mousemove', evt => {
  const li = evt.target.closest('li[data-idx]');
  if (!li || !stepTip.classList.contains('show')) return;
  positionTip(evt);
});
fsteps.addEventListener('mouseleave', evt => {
  const li = evt.target.closest('li[data-idx]');
  if (!li) return;
  stepTip.classList.remove('show');
}, true);

function setRole(role) {
  roleChips.forEach(c => c.classList.toggle('on', c.dataset.role === role));
  const allowed = ROLE_FLOWS[role];
  chips.forEach(c => {
    const flow = c.dataset.flow;
    c.style.display = (!allowed || flow === 'all' || allowed.includes(flow)) ? '' : 'none';
  });
  setFlow(allowed ? allowed[0] : 'all');
}
roleChips.forEach(c => c.addEventListener('click', () => setRole(c.dataset.role)));

nodes.forEach(n => n.addEventListener('click', () => {
  nodes.forEach(x => x.classList.remove('sel'));
  n.classList.add('sel');
  const d = DETAIL[n.dataset.k];
  if (!d) return;
  document.getElementById('d-title').textContent = d.t;
  document.getElementById('d-meta').textContent = d.m;
  document.getElementById('d-body').innerHTML = d.b;
}));

document.getElementById('themeToggle').addEventListener('click', () => {
  const dark = !document.documentElement.classList.contains('dark');
  document.documentElement.classList.toggle('dark', dark);
  localStorage.setItem('theme', dark ? 'dark' : 'light');
});
</script>
</body>
</html>
